# Static site. No build step. Canonical host is https://chencharuyishun.sg.
[build]
  publish = "."
  command = ""
  # Skip the deploy when a push changes only internal files (daily-run notes). Exit 0 = skip.
  # If the commits cannot be compared, git exits non-zero and Netlify builds as normal.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)ops' ':(exclude)seo-backlog.md' ':(exclude)data-sources.md' ':(exclude)CLAUDE.md'"

# Internal working files (CLAUDE.md, seo-backlog.md, data-sources.md, ops/ with the site generator) must never be served.
# Netlify publishes this folder as-is, so these paths return the 404 page with a real 404.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/claude.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/seo-backlog.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data-sources.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ops/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ops"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.chencharuyishun.sg/*"
  to = "https://chencharuyishun.sg/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/thank-you/"
  [headers.values]
    X-Robots-Tag = "noindex"
